name: Refresh CDN

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'live2d/**'
    paths-ignore:
      - '.github/**'
      - 'live2d/README.md'

jobs:
  refresh-cdn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          separator: " "
          files: |
            live2d/**

      - name: Setup Node.js
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.changed-files.outputs.any_changed == 'true'
        run: npm install

      - name: Run CDN refresh script
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          TEO_ZONE_ID: ${{ secrets.TEO_ZONE_ID }}
          TEO_DOMAIN: ${{ secrets.TEO_DOMAIN }}
        run: node scripts/refresh-cdn.js ${{ steps.changed-files.outputs.all_changed_files }}
